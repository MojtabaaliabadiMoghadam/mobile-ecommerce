# =====================================================================
#  اکسیر موبایل — فروشگاه موبایل با Next.js + PostgreSQL
#  اجرا:            docker compose up -d
#  seed دستی:      docker compose run --rm seed
#  نکته: MySQL / phpMyAdmin / لاراول / Nuxt حذف شده‌اند؛
#        این پروژه فقط با PostgreSQL (نسخه ۱۴ به بالا) کار می‌کند.
# =====================================================================
services:
  # ----------------------------------------------------
  # 1. PostgreSQL 16 — دیتابیس اصلی برنامه (Drizzle ORM)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: elixirmobile_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      elixirmobile_net:
        aliases:
          - db   # تا در زمان build هم بشود با نام `db` به دیتابیس وصل شد

  # ----------------------------------------------------
  # 2. برنامه Next.js (فرانت‌اند + API + پنل ادمین)
  #    در اولین اجرا: نصب، ساخت جداول (drizzle-kit push)، seed، سپس start
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elixirmobile/app:latest
    container_name: elixirmobile_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app:app_password@postgres:5432/app_db
      AUTH_SECRET: dev-only-secret-change-me-in-production-please
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ZARINPAL_SANDBOX: "true"
    ports:
      - "3000:3000"
    networks:
      - elixirmobile_net

  # ----------------------------------------------------
  # 3. ابزار مدیریت دیتابیس (گزینه‌ای) — جایگزین phpMyAdmin برای Postgres
  #    اجرا: docker compose --profile admin up -d
  #    آدرس: http://localhost:8081  (System: postgres / user: app / pass: app_password)
  # ----------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: elixirmobile_adminer
    restart: unless-stopped
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8081:8080"
    networks:
      - elixirmobile_net

  # ----------------------------------------------------
  # 4. Seed داده‌های نمونه (۲۶ محصول، ۶ کاربر، ۱۰ مقاله + بنر/تنظیمات/درگاه)
  #    idempotent است: اگر داده موجود باشد، کاری انجام نمی‌دهد.
  #    اجرا: docker compose run --rm seed
  # ----------------------------------------------------
  seed:
    image: elixirmobile/app:latest
    container_name: elixirmobile_seed
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app_password@postgres:5432/app_db
      AUTH_SECRET: dev-only-secret-change-me-in-production-please
    command: sh -c "npx tsx scripts/seed.ts && npx tsx scripts/seed_articles_once.ts"
    networks:
      - elixirmobile_net

networks:
  elixirmobile_net:
    driver: bridge

volumes:
  pg_data:
    driver: local
